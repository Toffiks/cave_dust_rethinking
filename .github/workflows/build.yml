name: Build supported versions

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Forge 1.20.1
            project: forge/1.20.1
            java: 17
          - name: NeoForge 1.21.1
            project: neoforge/1.21.1
            java: 21
          - name: Fabric 1.21.11
            project: fabric/1.21.11
            java: 21
          - name: NeoForge 26.1.2
            project: neoforge/26.1.2
            java: 25
          - name: Fabric 26.2
            project: fabric/26.2
            java: 25
          - name: Fabric 26.3
            project: fabric/26.3
            java: 25
          - name: NeoForge 26.3
            project: neoforge/26.3
            java: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        working-directory: ${{ matrix.project }}
        run: chmod +x gradlew

      - name: Build
        working-directory: ${{ matrix.project }}
        run: ./gradlew build --no-daemon

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
